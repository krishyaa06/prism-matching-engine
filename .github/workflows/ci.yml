name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Smoke test
        run: |
          node bin/match.js demo && node bin/match.js fix examples/orders.fix && node bin/match.js book --secs 5 && node bin/match.js bench --orders 50000 && node bin/match.js replay --secs 5
